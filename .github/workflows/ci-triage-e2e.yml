name: CI Triage E2E Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci-triage-e2e.yml
      - .github/workflows/ci-triage.yml
      - package.json
      - scripts/clean-dist.mjs
      - dist/index.js

permissions:
  contents: read

jobs:
  intentional-failure:
    runs-on: ubuntu-latest

    steps:
      - name: Generate deterministic connection failure
        run: |
          echo "CI Triage E2E test: a connection failure should be classified as NETWORK."
          curl --fail --silent --show-error http://127.0.0.1:9/test
