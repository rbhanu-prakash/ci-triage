name: Temporary bundle refresh

on:
  push:
    branches:
      - fix/workflow-docs-template-cleanup

permissions:
  contents: write

jobs:
  refresh:
    if: github.ref == 'refs/heads/fix/workflow-docs-template-cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/workflow-docs-template-cleanup

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build action bundle
        run: npm run build

      - name: Commit generated runtime files
        run: |
          git add dist/index.js dist/licenses.txt dist/package.json
          if git diff --cached --quiet; then
            echo "Generated action runtime is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: refresh bundled action runtime"
          git push origin HEAD:fix/workflow-docs-template-cleanup
