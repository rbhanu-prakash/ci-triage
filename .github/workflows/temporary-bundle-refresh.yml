name: Temporary bundle refresh

on:
  push:
    branches:
      - fix/runtime-bundle-e2e

permissions:
  contents: write

jobs:
  refresh:
    if: github.ref == 'refs/heads/fix/runtime-bundle-e2e'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/runtime-bundle-e2e
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build action bundle
        run: npm run build
      - name: Commit generated runtime files
        run: |
          git add -A dist
          if git diff --cached --quiet; then
            echo "Generated runtime is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: refresh self-contained action bundle"
          git push origin HEAD:fix/runtime-bundle-e2e
