name: CI Triage

on:
  workflow_run:
    workflows: ["CI Triage E2E Test"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  triage:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Run CI Triage
        id: triage
        uses: rbhanu-prakash/ci-triage@v0.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-pr: false

      - name: Assert expected classification
        if: always()
        env:
          CLASSIFICATION: ${{ steps.triage.outputs.classification }}
        run: |
          if [ "$CLASSIFICATION" != "NETWORK" ]; then
            echo "Expected NETWORK classification, got: ${CLASSIFICATION:-<empty>}"
            exit 1
          fi
          echo "CI Triage correctly classified the synthetic connection failure as NETWORK."
