name: CI Triage

on:
  workflow_run:
    workflows: ["CI Triage E2E Test"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  triage:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Run CI Triage
        uses: rbhanu-prakash/ci-triage@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-pr: false
